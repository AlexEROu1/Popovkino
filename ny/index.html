<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Новогодняя игра</title>
<style>html,body{margin:0;height:100%;background:#1b2a44;color:#fff;font-family:Arial,sans-serif}
#w{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#b{width:min(70vw,320px);height:10px;border:2px solid #fff}#f{height:100%;width:0;background:#e8433a}
#t{font-size:14px;letter-spacing:.08em;text-transform:uppercase}button{font:inherit;padding:10px 18px;background:#e8433a;color:#fff;border:0}</style>
</head><body><div id="w"><div id="t">Загрузка игры…</div><div id="b"><div id="f"></div></div></div>
<script>
/* всегда берём свежую версию игры, в обход кэша Телеграма и браузера */
(async()=>{const t=document.getElementById('t'),f=document.getElementById('f');
  try{const r=await fetch('game.html?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(r.status);
    const total=+r.headers.get('content-length')||2000000,rd=r.body.getReader(),parts=[];let got=0;
    for(;;){const {done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;f.style.width=Math.min(100,got/total*100)+'%'}
    const html=await new Blob(parts).text();document.open();document.write(html);document.close()}
  catch(e){t.textContent='Не удалось загрузить игру. Проверь интернет.';const b=document.createElement('button');b.textContent='Ещё раз';b.onclick=()=>location.reload();document.getElementById('w').append(b)}})();
</script></body></html>
