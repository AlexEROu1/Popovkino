<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Popovkino Village</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--tgtop:0px;--paper:#fffdf6;--ink:#1d1d1d;--red:#e8433a;--sky:#2b3f7a}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{font-family:"Comic Sans MS","Chalkboard SE","Trebuchet MS",Arial,sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(var(--tgtop) + 12px) 16px 12px;box-sizing:border-box;text-align:center;z-index:6}
.screen[hidden],[hidden]{display:none!important}
#menu{background:rgba(20,30,70,.35)}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:6px;padding:14px 22px;box-shadow:5px 5px 0 rgba(0,0,0,.35);transform:rotate(-1.5deg);max-width:min(90vw,520px)}
h1{margin:0;font-size:clamp(26px,6vw,46px);line-height:1.05}
p{margin:8px 0 0;font-size:clamp(14px,2.6vw,18px)}
.btn{font:inherit;font-size:clamp(18px,3.4vw,24px);font-weight:bold;padding:10px 26px;background:var(--red);color:#fff;border:3px solid var(--ink);border-radius:6px;box-shadow:4px 4px 0 rgba(0,0,0,.35);cursor:pointer;transform:rotate(1deg)}
.btn:active{transform:translate(2px,2px) rotate(1deg);box-shadow:2px 2px 0 rgba(0,0,0,.35)}
/* главное меню и опции */
.mbtns{display:flex;flex-direction:column;gap:14px;width:min(78vw,320px)}
.mbtns .btn{width:100%}
.mbtns .btn:nth-child(2){transform:rotate(-1.2deg)}.mbtns .btn:nth-child(3){transform:rotate(.6deg)}
.btn.alt{background:var(--paper);color:var(--ink)}
#opts .card,#bye .card{width:min(86vw,400px);box-sizing:border-box;text-align:left}
#opts h1,#bye h1{text-align:center;margin-bottom:6px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;font-size:clamp(16px,4.2vw,20px);font-weight:bold}
.seg{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
.seg button{font:inherit;font-size:clamp(14px,3.8vw,17px);padding:6px 10px;border:3px solid var(--ink);border-radius:6px;background:#fff;color:var(--ink);cursor:pointer}
.opt.col{flex-direction:column;align-items:stretch}.opt.col .seg{justify-content:stretch;flex-wrap:nowrap}.opt.col .seg button{flex:1}
.seg button.on{background:#ffd54a;box-shadow:2px 2px 0 rgba(0,0,0,.35)}
.optnote{font-size:clamp(12px,3.2vw,14px);color:#555;margin-top:10px;text-align:center}
#hint{position:fixed;top:calc(var(--tgtop) + 10px);left:50%;transform:translateX(-50%) rotate(-1deg);z-index:4;background:var(--paper);border:3px solid var(--ink);border-radius:6px;padding:6px 14px;font-size:clamp(13px,2.4vw,17px);box-shadow:3px 3px 0 rgba(0,0,0,.35);max-width:88vw;box-sizing:border-box;text-align:center;pointer-events:none;transition:opacity .5s}
#hint.off{opacity:0}
#hint.low{top:calc(var(--tgtop) + 84px)}
#rot{z-index:9;background:var(--sky)}
#rot .card{transform:rotate(1deg)}
/* кнопка «Говорить» */
#talk{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%) rotate(-1deg);z-index:4;font-size:clamp(17px,3vw,22px);padding:9px 22px;background:var(--paper);color:var(--ink);animation:pop .9s ease-in-out infinite alternate}
@keyframes pop{to{transform:translateX(-50%) rotate(1deg) scale(1.06)}}
/* окно диалога */
#dlg{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;width:min(92vw,720px);box-sizing:border-box;background:var(--paper);border:3px solid var(--ink);border-radius:6px;box-shadow:5px 5px 0 rgba(0,0,0,.35);padding:12px 18px 14px;cursor:pointer}
#dname{position:absolute;top:-17px;left:14px;padding:2px 12px;border:3px solid var(--ink);border-radius:5px;font-weight:bold;font-size:clamp(14px,2.4vw,18px);transform:rotate(-2deg)}
#dtext{font-size:clamp(16px,3vw,22px);min-height:1.3em;line-height:1.3;padding-top:4px;white-space:pre-line}
#dnext{position:absolute;right:12px;bottom:6px;font-size:14px;animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
/* бой */
#hud{position:fixed;left:0;right:0;top:calc(var(--tgtop) + 8px);z-index:4;display:flex;justify-content:space-between;padding:0 max(12px,env(safe-area-inset-left)) 0 max(12px,env(safe-area-inset-right));pointer-events:none}
.hp{background:var(--paper);border:3px solid var(--ink);border-radius:6px;box-shadow:3px 3px 0 rgba(0,0,0,.35);padding:4px 10px 7px;width:min(34vw,260px);box-sizing:border-box;transform:rotate(-1deg)}
.hp.r{transform:rotate(1deg);text-align:right}
.hp b{font-size:clamp(13px,2.3vw,17px)}
.hp i{display:block;height:12px;border:2px solid var(--ink);border-radius:4px;margin-top:3px;background:#ddd;overflow:hidden}
.hp s{display:block;height:100%;width:100%;transition:width .25s}
.hp.r s{margin-left:auto}
#throw{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:4;width:92px;height:92px;border-radius:50%;padding:0;background:#eaf6ff;color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 rgba(0,0,0,.35);font:inherit;font-weight:bold;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
#throw span{font-size:34px;line-height:1;margin-bottom:2px}
#throw.cd{opacity:.55}
#throw:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(0,0,0,.35)}
#banner{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;padding-top:calc(var(--tgtop) + max(8vh,108px));box-sizing:border-box;z-index:7;pointer-events:none}
#banner span{font-family:Impact,"Arial Black","Helvetica Neue",Arial,sans-serif;font-weight:900;font-size:clamp(54px,12vw,150px);letter-spacing:.04em;line-height:1;white-space:nowrap;
  background:linear-gradient(#fff6a0,#ffd21e 45%,#ff7a00);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:5px #1d1d1d;paint-order:stroke fill;
  filter:drop-shadow(7px 7px 0 rgba(0,0,0,.45));animation:bang .65s cubic-bezier(.2,1.7,.45,1) both,wob 1.1s .65s ease-in-out infinite alternate}
#banner.lose span{background:linear-gradient(#ffb4a8,#e8433a 50%,#7d150e);-webkit-background-clip:text;background-clip:text;animation:drop .7s cubic-bezier(.3,1.5,.5,1) both,wob 1.1s .7s ease-in-out infinite alternate}
@keyframes bang{0%{transform:scale(0) rotate(-25deg)}100%{transform:scale(1) rotate(-5deg)}}
@keyframes drop{0%{transform:translateY(-120vh) rotate(8deg)}100%{transform:translateY(0) rotate(4deg)}}
@keyframes wob{from{transform:scale(1) rotate(-5deg)}to{transform:scale(1.07) rotate(-2deg)}}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:8;transition:opacity .7s}
#fade.on{opacity:1}
</style>
</head><body>
<canvas id="c"></canvas>
<div id="hint" class="off"></div>
<button class="btn" id="talk" hidden>💬 Говорить</button>
<div id="dlg" hidden><div id="dname"></div><div id="dtext"></div><div id="dnext">▼</div></div>
<div id="hud" hidden>
  <div class="hp" id="hpL"><b>Лера</b><i><s style="background:#a6e22e"></s></i></div>
  <div class="hp r" id="hpN"><b>Настя</b><i><s style="background:#f27ab8"></s></i></div>
</div>
<button id="throw" hidden><span>❄</span>Снежок</button>
<div id="banner" hidden><span></span></div>
<div id="fade"></div>

<div class="screen" id="menu">
  <div class="card"><h1>Popovkino Village</h1><p>Новогодняя история</p></div>
  <div class="mbtns">
    <button class="btn" id="start">Начать играть</button>
    <button class="btn alt" id="optBtn">Опции</button>
    <button class="btn alt" id="exitBtn">Выход</button>
  </div>
</div>
<div class="screen" id="opts" hidden>
  <div class="card">
    <h1>Опции</h1>
    <div class="opt"><span>Звук</span><div class="seg" id="optSound"><button data-v="1">Вкл</button><button data-v="0">Выкл</button></div></div>
    <div class="opt col"><span>Сложность</span><div class="seg" id="optDiff"><button data-v="easy">Легко</button><button data-v="normal">Норм</button><button data-v="hard">Сложно</button></div></div>
    <p class="optnote">Сложность — насколько метко и часто кидает снежки Настя</p>
  </div>
  <button class="btn" id="optBack">Назад</button>
</div>
<div class="screen" id="bye" hidden>
  <div class="card"><h1>Пока!</h1><p style="text-align:center">Чтобы выйти, просто закрой вкладку</p></div>
  <button class="btn alt" id="byeBack">В меню</button>
</div>
<div class="screen" id="rot" hidden>
  <div class="card"><h1>↻</h1><p>Поверни телефон вертикально</p></div>
</div>

/* ---------- звук ---------- */
let ac=null,noise=null;
/* айфон в беззвучном режиме глушит звук страницы; тихая петля в обычном плеере переводит звук в режим «музыка» */
let sil=null;function unmute(){try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}if(sil)return;try{const n=8000,b=new Uint8Array(44+n),v=new DataView(b.buffer),w=(o,t)=>{for(let i=0;i<t.length;i++)b[o+i]=t.charCodeAt(i)};
    w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);b.fill(128,44);
    sil=new Audio(URL.createObjectURL(new Blob([b],{type:'audio/wav'})));sil.loop=true;sil.setAttribute('playsinline','');sil.setAttribute('x-webkit-airplay','deny');const pr=sil.play();if(pr)pr.catch(()=>{sil=null})}catch(e){sil=null}}
function unlock(){unmute();try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null}if(ac&&ac.state=='suspended'){try{ac.resume()}catch(e){}}}
['touchend','click','keydown'].forEach(ev=>addEventListener(ev,unlock,true));
/* настройки: звук и сложность, запоминаются на этом устройстве */
const OPT={sound:1,diff:'normal'};
try{Object.assign(OPT,JSON.parse(localStorage.getItem('ny_opts')||'{}'))}catch(e){}
function saveOpt(){try{localStorage.setItem('ny_opts',JSON.stringify(OPT))}catch(e){}}
/* как ведёт себя Настя в бою: шанс увернуться, пауза между бросками, шанс кинуть два подряд */
const DIFF={easy:{dodge:.28,cd:[1.25,1.95],dbl:.08},normal:{dodge:.5,cd:[.9,1.45],dbl:.18},hard:{dodge:.75,cd:[.55,.85],dbl:.3}};
const D=()=>DIFF[OPT.diff]||DIFF.normal;
function snd(f,d,type,vol,slide){if(!ac||!OPT.sound)return;try{const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+d);g.gain.setValueAtTime(vol||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noiseHit(freq,q,vol,dur,sweep){if(!ac||!OPT.sound)return;try{if(!noise){const n=ac.sampleRate*.5|0;noise=ac.createBuffer(1,n,ac.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}
  const t=ac.currentTime,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noise;f.type='bandpass';f.frequency.setValueAtTime(freq,t);if(sweep)f.frequency.exponentialRampToValueAtTime(freq*sweep,t+dur);f.Q.value=q;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t);s.stop(t+dur+.02)}catch(e){}}
const SFX={
  step:()=>noiseHit(1400+Math.random()*900,.9,.09,.11),
  whoosh:()=>noiseHit(700,1.4,.08,.22,3),
  splat:()=>{noiseHit(500,.7,.22,.2,.5);snd(180,.12,'triangle',.08,.5)},
  ouch:who=>snd(who===L?620:760,.18,'triangle',.07,.6),
  jump:()=>snd(300,.16,'square',.04,1.9),
  blip:who=>snd(who===L?460:640,.03,'square',.018),
  jingle:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>snd(f,.18,'triangle',.1),i*110)),
  sad:()=>[392,349,311,262].forEach((f,i)=>setTimeout(()=>snd(f,.28,'triangle',.09),i*180)),
  fanfare:()=>{[[523,0],[659,.12],[784,.24],[1047,.36]].forEach(([f,t])=>setTimeout(()=>snd(f,.16,'square',.06),t*1000));
    setTimeout(()=>{[523,659,784,1047].forEach(f=>snd(f,.9,'triangle',.07))},560)},
  lose:()=>[[392,.0,.42],[370,.45,.42],[349,.9,.42],[330,1.35,1.1]].forEach(([f,t,d])=>setTimeout(()=>snd(f,d,'sawtooth',.05,.94),t*1000)),
  flump:()=>noiseHit(260+Math.random()*120,.6,.13,.25)
};

function chkRot(){const land=touchDev&&matchMedia('(orientation:landscape)').matches;$('rot').hidden=!land;

/* ---------- мир: Popovkino Village ---------- */
const WW=2600,WH=714;                       // размер картинки фона = размер мира
/* линия горки (передний план слева); правее неё — ровное снежное поле */
const HILL=[[0,590],[100,520],[200,465],[300,420],[400,390],[500,370],[600,362],[700,365],[800,380],[900,410],[1000,450],[1100,500],[1200,555],[1280,595],[1330,625],[1380,655],[1430,685],[1470,720],[2600,720]];
function hillY(x){for(let i=1;i<HILL.length;i++)if(x<=HILL[i][0]){const a=HILL[i-1],b=HILL[i],k=(x-a[0])/(b[0]-a[0]);return a[1]+(b[1]-a[1])*k}return 720}
const plainMin=x=>x<1340?9999:x<1480?640-(x-1340)/140*200:440;
const yMin=x=>Math.min(hillY(x)+30,plainMin(x));
const X_MIN=40,X_MAX=2560,Y_MAX=702;
const SIGN={x:284,y:373,base:624};
const SNOWMAN={x:2060,y:566};
/* препятствия у земли (эллипсы под ногами) */
const OBST=[{x:447,y:620,rx:24,ry:11},{x:SNOWMAN.x,y:SNOWMAN.y,rx:52,ry:16}];
function walkable(x,y,self){if(x<X_MIN||x>X_MAX||y>Y_MAX||y<yMin(x))return false;
  for(const o of OBST){const dx=(x-o.x)/o.rx,dy=(y-o.y)/o.ry;if(dx*dx+dy*dy<1)return false}
  for(const c of CH)if(c!==self&&mode=='explore'){const dx=(x-c.x)/42,dy=(y-c.y)/14;if(dx*dx+dy*dy<1)return false}
  return true}
function clampWalk(x,y){x=clamp(x,X_MIN,X_MAX);y=clamp(y,yMin(x),Y_MAX);return[x,y]}
/* чем ближе к зрителю (ниже по экрану), тем крупнее */
const heroH=y=>170+clamp((y-385)/320,0,1)*95;

function joyEnd(e){if(!joy||e.pointerId!==joy.id)return;if(mode=='explore'&&!joy.drag&&performance.now()-joy.t<400){const w=toWorld(joy.x,joy.y);L.target=clampWalk(w[0],w[1])}joy=null}

function stick(){/* направление джойстика: [-1..1, -1..1], длина 0..1 */
  if(!joy||!joy.drag)return null;const dx=joy.x-joy.sx,dy=joy.y-joy.sy,l=Math.hypot(dx,dy);if(l<8)return null;return{x:dx/l,y:dy/l,a:Math.min(1,l/55),dx,dy}}

/* ---------- ходьба ---------- */
function setDir(c,mx,my){if(Math.abs(mx)>=Math.abs(my)*.8)c.dir=mx>0?'right':'left';else c.dir=my>0?'down':'up'}
function stepAnim(c,moved,amt,dt){c.mv+=((moved>.05?1:0)-c.mv)*Math.min(1,dt*12);
  if(moved>.05&&c.z<=0){const b=Math.sin(c.ph);c.ph+=dt*10*Math.max(.6,amt);const a=Math.sin(c.ph);if(b>0&&a<=0||b<0&&a>=0)SFX.step()}}
function moveFree(c,mx,my,amt,dt,spd){const SPD=(spd||270)*amt,nx=c.x+mx*SPD*dt,ny=c.y+my*SPD*.7*dt,ox=c.x,oy=c.y;
  if(amt){if(walkable(nx,ny,c)){c.x=nx;c.y=ny}else if(walkable(nx,c.y,c))c.x=nx;else if(walkable(c.x,ny,c))c.y=ny;
    else{const k=clampWalk(nx,ny);if(walkable(k[0],k[1],c)){c.x=k[0];c.y=k[1]}}setDir(c,mx,my)}
  const moved=Math.hypot(c.x-ox,c.y-oy);stepAnim(c,moved,amt,dt);return moved}
/* сценарная ходьба к точке (без проверки препятствий) */
function walkTo(c,x,y){return new Promise(r=>{c.goal={x,y,r}})}
function goalStep(c,dt){if(!c.goal)return;const g=c.goal,dx=g.x-c.x,dy=(g.y-c.y)/.7,l=Math.hypot(dx,dy);
  if(l<4){c.x=g.x;c.y=g.y;c.goal=null;stepAnim(c,0,0,dt);g.r();return}
  const s=Math.min(l,220*dt);c.x+=dx/l*s;c.y+=dy/l*s*.7;setDir(c,dx,dy);stepAnim(c,s,1,dt)}

/* ---------- прогулка ---------- */
function updExplore(dt){
  let mx=(keys.r-keys.l),my=(keys.d-keys.u),amt=0;const st=stick();
  if(mx||my){const l=Math.hypot(mx,my);mx/=l;my/=l;amt=1}

/* ---------- снежки ---------- */
const G_BALL=350;
function spawnBall(c,vx,vy,vz,z0){const h=heroH(c.y),f=Math.sign(vx)||1;
  balls.push({x:c.x+f*h*.2,y:c.y,z:z0!=null?z0:c.z+h*.55,vx,vy,vz,owner:c});c.lean=1;SFX.whoosh()}
/* бросок в конкретную цель (для сценки): прилетает в спину на уровне груди */
function throwAt(c,t){return new Promise(res=>{c.dir=t.x<c.x?'left':'right';windup(c,()=>{const h0=heroH(c.y),z0=h0*.5,tx=t.x,ty=t.y,d=Math.hypot(tx-c.x,ty-c.y),tt=d/650,zt=heroH(t.y)*.55;
  spawnBall(c,(tx-c.x)/tt,(ty-c.y)/tt,(zt-z0+.5*G_BALL*tt*tt)/tt,z0);balls[balls.length-1].done=res})})}
/* замах: рука уходит назад за голову, резко вперёд — снежок вылетает — рука опускается */
const REL=.17,THROW_T=.42;
function windup(c,release){c.throwT=0;c.release=release}
function updThrow(c,dt){if(c.throwT==null)return;c.throwT+=dt;if(c.release&&c.throwT>=REL){const r=c.release;c.release=null;r()}if(c.throwT>THROW_T)c.throwT=null}
function armAngle(t){const e=x=>1-(1-x)*(1-x);   // 90° — вниз, 180° — назад, 270° — вверх, 360° — вперёд
  if(t<.1)return 90+135*e(t/.1);            // замах назад-вверх
  if(t<.2)return 225+125*((t-.1)/.1);        // резко через верх вперёд
  if(t<.3)return 350+50*e((t-.2)/.1);        // проводка вниз
  return 400+50*((t-.3)/(THROW_T-.3))}       // рука возвращается
function bodyHit(b,c){const h=heroH(c.y);return Math.abs(b.x-c.x)<h*.17&&Math.abs(b.y-c.y)<26&&b.z>c.z+8&&b.z<c.z+h*.95}
function splat(x,y,z){for(let i=0;i<12;i++)parts.push({x,y,z,vx:rnd(-160,160),vy:rnd(-20,20),vz:rnd(40,260),t:rnd(.35,.6),r:rnd(2,5)})}
const OUCH={[L.name]:['Ай!','Эй!','Холодно!'],[N.name]:['Ой!','Ах ты!','Ай!']};
function updBalls(dt){
  for(const b of balls){b.vz-=G_BALL*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.z+=b.vz*dt;
    for(const c of CH){if(c===b.owner||b.dead)continue;if(bodyHit(b,c)){b.dead=1;onHit(c,b);if(b.done)b.done()}}
    if(!b.dead&&(b.z<=0||b.x<-50||b.x>WW+50)){b.dead=1;splat(b.x,b.y,0);if(b.done)b.done()}}
  balls=balls.filter(b=>!b.dead);
  for(const p of parts){p.vz-=900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z=Math.max(0,p.z+p.vz*dt);p.t-=dt}
  parts=parts.filter(p=>p.t>0)}
function onHit(c,b){splat(b.x,b.y,b.z);SFX.splat();SFX.ouch(c);c.flash=.45;
  if(mode=='fight'){if(c.inv>0)return;c.hp=Math.max(0,c.hp-10);c.inv=.3;c.x=clamp(c.x+Math.sign(b.vx)*22,ARENA[0],ARENA[1]);hud();
    if(Math.random()<.4)bubble(c,OUCH[c.name][Math.random()*3|0]);if(c.hp<=0)endFight(c===N)}
  else c.x+=Math.sign(b.vx)*14}

/* ---------- бой ---------- */
const FY=668,ARENA=[1480,2380];
const BOT={think:0,want:550,mdir:0,cd:1.4,react:-1};
function setupFight(){mode='fight';balls=[];parts=[];
  for(const c of CH){c.throwT=null;c.release=null}
  Object.assign(L,{x:1620,y:FY,z:0,vz:0,hp:100,flash:0,inv:0,goal:null,anim:null,cd:0});
  Object.assign(N,{x:2240,y:FY,z:0,vz:0,hp:100,flash:0,inv:0,goal:null,anim:null});

  jumpQ=throwQ=false;joy=null;cam.focus=null;$('hud').hidden=false;$('throw').hidden=false;hud();updCam(0,true)}
function hud(){$('hpL').querySelector('s').style.width=L.hp+'%';$('hpN').querySelector('s').style.width=N.hp+'%'}
function jump(c){if(c.z>0||c.vz)return;c.vz=900;SFX.jump()}

function physics(c,dt){if(c.z>0||c.vz){c.vz-=2200*dt;c.z+=c.vz*dt;if(c.z<=0){c.z=0;c.vz=0}}}
function updFight(dt){
  // Лера
  const st=stick();let mx=keys.r-keys.l;
  if(!mx&&st&&Math.abs(st.dx)>12)mx=clamp(st.dx/55,-1,1);
  if(st&&st.dy<-35&&-st.dy>Math.abs(st.dx)*.9){if(!joy.up){joy.up=true;jumpQ=true}}else if(joy&&(!st||st.dy>-20))joy.up=false;
  if(jumpQ){jump(L);jumpQ=false}

  // Настя — бот

  L.dir=N.x>L.x?'right':'left';N.dir=L.x>N.x?'right':'left';
  for(const c of CH){physics(c,dt);c.inv=Math.max(0,c.inv-dt)}
}
function bot(dt){

    if(Math.random()<.2)BOT.want=rnd(330,600);

    if(!N.z&&Math.random()<.05)jump(N)}

}
let burial=null,drops=[],confetti=[];

function banner(text,win){const b=$('banner');b.className=win?'':'lose';b.querySelector('span').textContent=text;
  b.hidden=true;void b.offsetWidth;b.hidden=false;(win?SFX.fanfare:SFX.lose)();
  if(win)for(let i=0;i<90;i++)confetti.push({x:W/2+rnd(-40,40),y:H*.45,vx:rnd(-420,420),vy:rnd(-650,-150),r:rnd(0,6.3),vr:rnd(-9,9),w:rnd(6,11),h:rnd(10,16),c:['#e8433a','#ffd21e','#a6e22e','#4ab3ff','#f27ab8'][i%5]})}
/* снег падает с неба и засыпает проигравшего: растёт сугроб, в конце видны только глаза */
function updBurial(dt){if(!burial)return;const b=burial,c=b.c,h=heroH(c.y);b.t+=dt;
  const p=Math.min(1,Math.max(0,(b.t-.35)/2.1));b.pile=1-(1-p)*(1-p);
  if(b.t<2.6)for(let i=0;i<4;i++)if(Math.random()<.7)drops.push({x:c.x+rnd(-h*.38,h*.38),y:c.y-h-rnd(250,600),vy:rnd(500,800),r:rnd(5,12)});
  const top=c.y-h*1.08*b.pile;
  for(const d of drops){d.y+=d.vy*dt;if(d.y>=top+d.r*.5){d.dead=1;if(Math.random()<.04)SFX.flump()}}
  drops=drops.filter(d=>!d.dead)}
function drawMound(c){const b=burial,h=heroH(c.y),ph=h*1.1*b.pile;if(ph<2)return;const x=c.x,y=c.y,bw=h*(.34+.36*b.pile);
  ctx.fillStyle='#f3f6fa';ctx.strokeStyle='#1d1d1d';ctx.lineWidth=3;ctx.lineJoin='round';
  // широкий круглый сугроб с комковатой верхушкой
  ctx.beginPath();ctx.moveTo(x-bw,y+3);
  ctx.bezierCurveTo(x-bw*.78,y-ph*.62,x-bw*.62,y-ph*.97,x-bw*.26,y-ph*.99);
  ctx.quadraticCurveTo(x-bw*.1,y-ph*1.05,x+bw*.06,y-ph*1.0);
  ctx.quadraticCurveTo(x+bw*.24,y-ph*1.04,x+bw*.36,y-ph*.96);
  ctx.bezierCurveTo(x+bw*.66,y-ph*.92,x+bw*.8,y-ph*.6,x+bw,y+3);ctx.closePath();ctx.fill();ctx.stroke();
  // пара складок на снегу
  ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-bw*.55,y-ph*.35);ctx.quadraticCurveTo(x-bw*.4,y-ph*.42,x-bw*.25,y-ph*.36);
  ctx.moveTo(x+bw*.2,y-ph*.22);ctx.quadraticCurveTo(x+bw*.38,y-ph*.3,x+bw*.55,y-ph*.2);ctx.stroke();ctx.lineWidth=3;
  if(b.pile>=1){ // из сугроба торчат только глаза
    const ey=y-h*.8,er=h*.042,blink=(time%3.2)<.12,look=c===N?-1:1;
    for(const s of [-1,1]){const ex=x+s*er*1.05;ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(ex,ey,er,blink?er*.12:er*1.25,0,0,Math.PI*2);ctx.fill();ctx.stroke();
      if(!blink){ctx.fillStyle='#1d1d1d';ctx.beginPath();ctx.arc(ex+look*er*.4,ey+er*.15,er*.33,0,Math.PI*2);ctx.fill()}}}}
function drawDrops(){ctx.fillStyle='#fbfdff';ctx.strokeStyle='#1d1d1d';ctx.lineWidth=2;for(const d of drops){ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fill();ctx.stroke()}}
function drawConfetti(dt){for(const p of confetti){p.vy+=900*dt;p.vx*=.99;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*1.7)));ctx.restore()}
  confetti=confetti.filter(p=>p.y<H+40)}

/* ---------- камера ---------- */
cam.focus=null;
/* ширина видимого куска мира на вертикальном экране */
const VIEW_W={explore:780,fight:1000,talk:540};
function updCam(dt,snap){
  const k=snap?1:Math.min(1,dt*3.2),f=cam.focus,fightish=mode=='fight'||mode=='over',portrait=H>W*1.05;
  const cx0=cam.x+W/cam.s/2,cy0=cam.y+H/cam.s/2;
  // масштаб: в диалоге и на итогах боя камера приближается
  const st=portrait?W/(f?VIEW_W.talk:fightish?VIEW_W.fight:VIEW_W.explore):Math.max(W/1280,H/WH)*(f?1.25:1);
  cam.s=snap?st:cam.s+(st-cam.s)*k;const vw=W/cam.s,vh=H/cam.s;
  let fx,fy;
  if(f){const h=heroH(f.y);fx=f.x;fy=f.y-h*.5}
  else{const h=heroH(L.y);fx=fightish?(L.x+N.x)/2:L.x;fy=(fightish?FY:L.y)-h*.6}
  // на вертикальном экране герой — чуть выше середины, внизу место под джойстик и кнопки
  if(portrait)fy+=vh*(f?.06:.1);else if(f)fy+=vh*.1;
  const minX=(!portrait&&!f&&fightish)?Math.min(1320,WW-vw):0;
  const cx=snap?fx:cx0+(fx-cx0)*k,cy=snap?fy:cy0+(fy-cy0)*k;
  cam.x=clamp(cx-vw/2,minX,Math.max(minX,WW-vw));
  cam.y=portrait?cy-vh/2:clamp(cy-vh/2,0,Math.max(0,WH-vh))}
cam.s=1;

/* ---------- рисование ---------- */
const VIEW={down:'front',up:'back',left:'side',right:'side'};
function drawChar(c){
  const v=VIEW[c.dir],h=heroH(c.y);let im=c.art[v];if(v=='side'&&c.throwT!=null&&c.art.side_noarm.naturalWidth)im=c.art.side_noarm;if(!im.complete||!im.naturalWidth)return;
  const w=h*im.naturalWidth/im.naturalHeight,bob=Math.abs(Math.sin(c.ph))*7*c.mv;
  let tilt=Math.sin(c.ph)*.045*c.mv,sy=1+Math.sin(time*2.2+(c===N?1.3:0))*.008*(1-c.mv);
  if(c.anim=='sculpt'){tilt+=Math.sin(time*7)*.05;sy*=1+Math.abs(Math.sin(time*7))*.015}
  if(c.lean>0)tilt+=(c.dir=='left'?-1:1)*c.lean*.14;
  if(c.z>0)sy*=1+Math.min(.05,c.vz/9000);
  // тень (меньше, когда в прыжке)
  const sh=1/(1+c.z/160);ctx.fillStyle='rgba(40,50,90,.22)';ctx.beginPath();ctx.ellipse(c.x,c.y,w*.42*sh,(h*.035+3)*sh,0,0,Math.PI*2);ctx.fill();
  ctx.save();if(c.flash>0&&Math.floor(c.flash*20)%2)ctx.globalAlpha=.45;
  ctx.translate(c.x,c.y-bob-c.z);ctx.rotate(tilt);if(c.dir=='left')ctx.scale(-1,1);ctx.scale(1,sy);
  ctx.drawImage(im,-w/2,-h,w,h);
  if(c.throwT!=null)drawArm(c,h,VIEW[c.dir]=='side'?1:0);
  ctx.restore();
  if(burial&&burial.c===c)drawMound(c);
  if(c.bub)drawBubble(c.x,c.y-c.z-h-10,c.bub.t)}
function drawArm(c,h,side){const A=c.arm,a=armAngle(c.throwT)*Math.PI/180,sx=side?h*A.x:h*.13,sy=h*A.y,len=h*.3,tw=h*A.w;
  ctx.globalAlpha*=c.throwT>THROW_T-.08?Math.max(0,(THROW_T-c.throwT)/.08):1;
  ctx.save();ctx.translate(sx,sy);ctx.rotate(a);ctx.lineWidth=2.6;ctx.strokeStyle='#1d1d1d';ctx.lineJoin='round';
  ctx.fillStyle=c.sleeve;ctx.beginPath();ctx.roundRect?ctx.roundRect(-tw*.55,-tw/2,len,tw,tw*.45):ctx.rect(-tw*.55,-tw/2,len,tw);ctx.fill();ctx.stroke();
  ctx.fillStyle='#f5d2b4';ctx.beginPath();ctx.ellipse(len,0,tw*.52,tw*.46,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  if(c.release){const r=heroH(c.y)*.045;ctx.fillStyle='#fbfdff';ctx.beginPath();ctx.arc(len+tw*.35,0,r,0,Math.PI*2);ctx.fill();ctx.stroke()}
  ctx.restore()}
function drawBubble(x,y,t){ctx.font='bold 22px "Comic Sans MS","Chalkboard SE",Arial';const w=ctx.measureText(t).width+22;
  ctx.fillStyle='#fffdf6';ctx.strokeStyle='#1d1d1d';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect?ctx.roundRect(x-w/2,y-38,w,34,8):ctx.rect(x-w/2,y-38,w,34);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(x-7,y-5);ctx.lineTo(x,y+7);ctx.lineTo(x+7,y-5);ctx.fill();ctx.stroke();ctx.fillStyle='#fffdf6';ctx.fillRect(x-6,y-8,12,5);
  ctx.fillStyle='#1d1d1d';ctx.textAlign='center';ctx.fillText(t,x,y-14)}
function drawSign(){const s=ART.sign;if(s.complete&&s.naturalWidth)ctx.drawImage(s,SIGN.x,SIGN.y)}
/* снеговик в стиле картонной вырезки — ростом с персонажей */
function drawSnowman(){const x=SNOWMAN.x,y=SNOWMAN.y,h=heroH(y)*1.02,ink='#1d1d1d';
  ctx.fillStyle='rgba(40,50,90,.2)';ctx.beginPath();ctx.ellipse(x,y,h*.3,h*.05,0,0,Math.PI*2);ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle=ink;ctx.lineJoin='round';
  const r1=h*.24,r2=h*.18,r3=h*.135,c1=y-r1*.92,c2=c1-r1*.8-r2*.75,c3=c2-r2*.8-r3*.75;
  // руки-веточки
  ctx.strokeStyle='#5b3a1e';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x-r2*.8,c2);ctx.lineTo(x-r2*2.1,c2-r2*.7);ctx.moveTo(x-r2*1.7,c2-r2*.45);ctx.lineTo(x-r2*1.9,c2-r2*1.0);
  ctx.moveTo(x+r2*.8,c2);ctx.lineTo(x+r2*2.0,c2-r2*.9);ctx.moveTo(x+r2*1.6,c2-r2*.6);ctx.lineTo(x+r2*2.1,c2-r2*.45);ctx.stroke();
  ctx.strokeStyle=ink;ctx.lineWidth=3;
  for(const [cy,r] of [[c1,r1],[c2,r2],[c3,r3]]){ctx.fillStyle='#f3f6fa';ctx.beginPath();ctx.ellipse(x,cy,r*1.04,r,0,0,Math.PI*2);ctx.fill();ctx.stroke()}
  // шарф
  ctx.fillStyle='#e8433a';ctx.beginPath();ctx.ellipse(x,c2-r2*.78,r2*.82,r2*.2,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.rect(x+r2*.25,c2-r2*.75,r2*.28,r2*.85);ctx.fill();ctx.stroke();
  // пуговицы-угольки
  ctx.fillStyle=ink;for(const k of [-.35,.05,.45]){ctx.beginPath();ctx.arc(x,c2+r2*k+r2*.1,r2*.08,0,Math.PI*2);ctx.fill()}
  // лицо
  ctx.beginPath();ctx.arc(x-r3*.35,c3-r3*.2,r3*.1,0,Math.PI*2);ctx.arc(x+r3*.35,c3-r3*.2,r3*.1,0,Math.PI*2);ctx.fill();
  for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(x-r3*.45+i*r3*.22,c3+r3*.42+Math.sin(i/4*Math.PI)*r3*.12,r3*.06,0,Math.PI*2);ctx.fill()}
  ctx.fillStyle='#f28a1e';ctx.beginPath();ctx.moveTo(x,c3-r3*.02);ctx.lineTo(x+r3*.95,c3+r3*.12);ctx.lineTo(x,c3+r3*.2);ctx.closePath();ctx.fill();ctx.stroke();
  // ведро на голове
  ctx.fillStyle='#8a97a6';ctx.beginPath();ctx.moveTo(x-r3*.75,c3-r3*.62);ctx.lineTo(x+r3*.6,c3-r3*.82);ctx.lineTo(x+r3*.42,c3-r3*1.55);ctx.lineTo(x-r3*.48,c3-r3*1.42);ctx.closePath();ctx.fill();ctx.stroke();
  // пока Настя лепит — летит снег от её рук
  if(N.anim=='sculpt'&&Math.random()<.08)parts.push({x:x-r1*.9,y:y+2,z:rnd(h*.25,h*.6),vx:rnd(-40,30),vy:rnd(-5,5),vz:rnd(60,160),t:rnd(.3,.5),r:rnd(1.5,3.5)})}
function drawBall(b){const r=heroH(b.y)*.045;
  ctx.fillStyle='rgba(40,50,90,.18)';ctx.beginPath();ctx.ellipse(b.x,b.y,r*1.1,r*.35,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fbfdff';ctx.strokeStyle='#1d1d1d';ctx.lineWidth=2.2;ctx.beginPath();ctx.arc(b.x,b.y-b.z,r,0,Math.PI*2);ctx.fill();ctx.stroke()}
function drawParts(){ctx.fillStyle='#fbfdff';for(const p of parts){ctx.globalAlpha=Math.min(1,p.t*3);ctx.beginPath();ctx.arc(p.x,p.y-p.z,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
const STARS=Array.from({length:240},()=>({x:Math.random()*WW,y:-Math.random()*1500-15,r:rnd(1.4,3.2)}));
function drawBeyond(){const top=cam.y,bot=cam.y+H/cam.s,x0=cam.x-4,ww=W/cam.s+8;
  if(top<0){const g=ctx.createLinearGradient(0,-1500,0,0);g.addColorStop(0,'#141d42');g.addColorStop(1,'#334c8f');ctx.fillStyle=g;ctx.fillRect(x0,top-4,ww,-top+5);
    ctx.fillStyle='#eef2ff';for(const s of STARS)if(s.y>top&&s.x>x0&&s.x<x0+ww){ctx.globalAlpha=.55+.45*Math.sin(time*2+s.x);ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
  if(bot>WH){ctx.fillStyle='#dae3ea';ctx.fillRect(x0,WH-2,ww,bot-WH+6)}}
let flakes=Array.from({length:60},()=>({x:Math.random(),y:Math.random(),s:1.2+Math.random()*2.4,v:.03+Math.random()*.05,p:Math.random()*6}));
function drawSnow(dt){ctx.fillStyle='rgba(255,255,255,.9)';for(const f of flakes){f.y+=f.v*dt;if(f.y>1.02){f.y=-.02;f.x=Math.random()}const x=(f.x+Math.sin(time*.8+f.p)*.01)*W,y=f.y*H;ctx.beginPath();ctx.arc(x,y,f.s,0,Math.PI*2);ctx.fill()}}
function drawJoy(){if(!joy||!joy.drag)return;const dx=joy.x-joy.sx,dy=joy.y-joy.sy,l=Math.hypot(dx,dy),k=l>55?55/l:1;
  ctx.lineWidth=3;ctx.strokeStyle='rgba(29,29,29,.7)';ctx.fillStyle='rgba(255,253,246,.35)';ctx.beginPath();ctx.arc(joy.sx,joy.sy,55,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(255,253,246,.9)';ctx.beginPath();ctx.arc(joy.sx+dx*k,joy.sy+dy*k,24,0,Math.PI*2);ctx.fill();ctx.stroke()}

let last=0;
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;time+=dt;
  if(mode=='explore')updExplore(dt);
  else if(mode=='fight')updFight(dt);
  else if(mode=='over')for(const c of CH){physics(c,dt);stepAnim(c,0,0,dt);if(c.cheer&&!c.z&&!c.vz&&Math.random()<dt*1.6){c.vz=560;SFX.jump()}}
  updBurial(dt);
  for(const c of CH){goalStep(c,dt);updThrow(c,dt);c.flash=Math.max(0,c.flash-dt);c.lean=Math.max(0,c.lean-dt*5);if(c.bub&&(c.bub.ttl-=dt)<0)c.bub=null}
  updBalls(dt);
  updCam(dt);
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#2b3f7a';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.scale(cam.s,cam.s);ctx.translate(-cam.x,-cam.y);
  drawBeyond();
  if(ART.village.complete)ctx.drawImage(ART.village,0,0,WW,WH);
  // всё, что стоит на земле, рисуем от дальнего к ближнему
  const list=[{y:SIGN.base,d:drawSign},{y:SNOWMAN.y,d:drawSnowman},...CH.map(c=>({y:c.y+.1,d:()=>drawChar(c)})),...balls.map(b=>({y:b.y+.2,d:()=>drawBall(b)}))];
  list.sort((a,b)=>a.y-b.y);for(const it of list)it.d();
  drawParts();drawDrops();
  if(L.target&&mode=='explore'){ctx.strokeStyle='rgba(29,29,29,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(L.target[0],L.target[1],14,5,0,0,Math.PI*2);ctx.stroke()}
  ctx.restore();
  drawSnow(dt);drawJoy();drawConfetti(dt);
  requestAnimationFrame(loop)}

function hint(t,ms){const h=$('hint');h.textContent=t;h.classList.remove('off');h.classList.toggle('low',mode=='fight');clearTimeout(hint.t);hint.t=setTimeout(()=>h.classList.add('off'),ms||4000)}
function showScreen(id){for(const k of ['menu','opts','bye'])$(k).hidden=k!==id}
function paintOpts(){for(const b of $('optSound').children)b.classList.toggle('on',+b.dataset.v===OPT.sound);
  for(const b of $('optDiff').children)b.classList.toggle('on',b.dataset.v===OPT.diff)}
const click=()=>snd(700,.05,'square',.04);
$('optBtn').onclick=()=>{unlock();click();paintOpts();showScreen('opts')};
$('optBack').onclick=()=>{click();showScreen('menu')};
$('optSound').onclick=e=>{const b=e.target.closest('button');if(!b)return;OPT.sound=+b.dataset.v;saveOpt();paintOpts();click()};
$('optDiff').onclick=e=>{const b=e.target.closest('button');if(!b)return;OPT.diff=b.dataset.v;saveOpt();paintOpts();click()};
$('exitBtn').onclick=()=>{click();if(TG&&TG.close){TG.close();return}try{window.close()}catch(e){}setTimeout(()=>showScreen('bye'),250)};
$('byeBack').onclick=()=>showScreen('menu');
$('start').onclick=()=>{unlock();goPortrait();SFX.jingle();showScreen(null);mode='explore';
  hint(touchDev?'Веди пальцем по экрану или тапни, куда идти':'Стрелки / WASD или клик мышкой, куда идти',5000)};
updCam(0,true);chkRot();requestAnimationFrame(loop);

/* внутри Telegram: полный экран, запрет сворачивания свайпом и отступ под кнопки самого Telegram */
try{const tg=window.Telegram&&window.Telegram.WebApp;if(tg&&tg.platform&&tg.platform!='unknown'){
  const pad=()=>{const a=tg.safeAreaInset||{},c=tg.contentSafeAreaInset||{};TGTOP=(a.top||0)+(c.top||0);document.documentElement.style.setProperty('--tgtop',TGTOP+'px')};
  tg.ready();tg.expand();if(tg.disableVerticalSwipes)tg.disableVerticalSwipes();
  if(tg.setHeaderColor)tg.setHeaderColor('#2b3f7a');if(tg.setBackgroundColor)tg.setBackgroundColor('#2b3f7a');
  for(const ev of ['fullscreenChanged','safeAreaChanged','contentSafeAreaChanged','viewportChanged'])tg.onEvent&&tg.onEvent(ev,()=>{pad();resize();chkRot()});
  if(/ios|android/.test(tg.platform)&&tg.requestFullscreen&&(!tg.isVersionAtLeast||tg.isVersionAtLeast('8.0'))){try{tg.requestFullscreen()}catch(e){}}
  pad()}}catch(e){}
</script>
</body></html>
